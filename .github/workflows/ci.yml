name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # One-click sign-in (see worker/README.md). Without these the app
          # still works; Settings offers the token option instead.
          VITE_GITHUB_CLIENT_ID: ${{ vars.SIGNIN_CLIENT_ID }}
          VITE_AUTH_URL: ${{ vars.SIGNIN_URL }}
          VITE_GITHUB_APP_SLUG: ${{ vars.SIGNIN_APP_SLUG }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    # Publishes the app to GitHub Pages. Needs Settings → Pages → Source: "GitHub Actions".
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
