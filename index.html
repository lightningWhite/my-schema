<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Turn tidbits in passing into guideposts." />
    <meta name="theme-color" content="#f3f5f8" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Schema</title>
    <script>
      // Apply the saved style before first paint (see src/app/theme.ts).
      try {
        var t = JSON.parse(localStorage.getItem('schema.theme') || '{}');
        document.documentElement.dataset.style = t.style === 'reflect' ? 'reflect' : 'focus';
        if (t.appearance === 'light' || t.appearance === 'dark') document.documentElement.dataset.theme = t.appearance;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
